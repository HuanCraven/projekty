<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekty 2026/27 – katalog témat</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --line:#e5e2dc;
    --sc4:#b9770e; --sc1:#1f618d; --sc5:#922b21; --sc8:#1e8449;
    --sc4bg:#fdf3e3; --sc1bg:#e8f1f8; --sc5bg:#faeceb; --sc8bg:#e9f7ee;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5;}
  header{background:#1f4e5f; color:#fff; padding:22px 16px 18px; text-align:center;}
  header h1{font-size:1.35rem; letter-spacing:.02em;}
  header p{opacity:.75; font-size:.85rem; margin-top:4px;}
  .toolbar{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 12px; display:flex; flex-direction:column; gap:8px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .chip{border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:.82rem; cursor:pointer; user-select:none; white-space:nowrap;}
  .chip.active{color:#fff; border-color:transparent;}
  .chip[data-sc="vse"].active{background:#1f4e5f;}
  .chip[data-sc="SC4"].active{background:var(--sc4);}
  .chip[data-sc="SC1"].active{background:var(--sc1);}
  .chip[data-sc="SC5"].active{background:var(--sc5);}
  .chip[data-sc="SC8"].active{background:var(--sc8);}
  .chip[data-tr].active{background:#374151;}
  .searchwrap{display:flex; justify-content:center;}
  #search{width:100%; max-width:420px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; font-size:.9rem; background:#fff;}
  #count{text-align:center; font-size:.75rem; color:var(--muted);}
  main{max-width:1060px; margin:0 auto; padding:16px 12px 60px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); grid-auto-rows:1fr; gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:12px; padding:14px 16px; cursor:pointer; transition:box-shadow .15s, transform .15s; display:flex; flex-direction:column;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-1px);}
  .card .num{font-size:.72rem; color:var(--muted);}
  .card h3{font-size:1.02rem; margin:2px 0 6px;}
  .tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .tag{font-size:.68rem; padding:2px 8px; border-radius:999px; background:var(--accentbg); color:var(--accent); font-weight:600;}
  .tag.tr{background:#eef0f3; color:#4b5563; font-weight:500;}
  .card p{font-size:.83rem; color:#374151; flex:1;}
  .kam{margin-top:8px; font-size:.72rem; color:var(--muted);}
  /* detail */
  #overlay{position:fixed; inset:0; background:rgba(15,23,32,.55); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  #overlay.open{display:flex;}
  #detail{background:#fff; width:100%; max-width:760px; max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px 20px 40px; -webkit-overflow-scrolling:touch;}
  @media(min-width:780px){ #overlay{align-items:center;} #detail{border-radius:18px; max-height:88vh;} }
  #detail .num{color:var(--muted); font-size:.8rem;}
  #detail h2{font-size:1.3rem; margin:2px 0 10px; color:var(--accent);}
  #detail .anot{font-size:.95rem; margin-bottom:14px;}
  #detail ul{padding-left:18px; font-size:.88rem; margin-top:6px;}
  #detail li{margin-bottom:4px;}
  #detail li.lead{font-weight:600;}
  #detail details{border:1px solid var(--line); border-radius:10px; margin-top:8px; padding:0 12px; background:#fbfbfa;}
  #detail details[open]{padding-bottom:10px; background:#fff;}
  #detail summary{cursor:pointer; padding:10px 0; font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:#374151; font-weight:600; list-style:none; display:flex; justify-content:space-between; align-items:center;}
  #detail summary::-webkit-details-marker{display:none;}
  #detail summary::after{content:"▾"; color:var(--muted); transition:transform .15s;}
  #detail details[open] summary::after{transform:rotate(180deg);}
  .closebtn{position:sticky; top:0; float:right; background:#eef0f3; border:none; border-radius:999px; width:34px; height:34px; font-size:1rem; cursor:pointer;}
  .difbox{background:#f7f7f5; border-radius:10px; padding:10px 12px; margin-top:6px; font-size:.85rem;}
  .difbox b{font-size:.8rem;}
  .loni{font-style:italic; color:var(--muted); font-size:.85rem;}
  footer{ text-align:center; font-size:.75rem; color:var(--muted); padding:20px;}
</style>
</head>

<script>
const DATA = [{"id": 1, "nazev": "Spánek: třetina života", "skupina": "SC4", "vedouci": ["4.1.1.2 Spím"], "vedlejsi": ["8.2.1.5 Zpracovávám data", "1.2.2.1 Využívám poznatky o procesu učení", "8.3.1.2 Rozvrhuji si čas"], "urovne": "obě", "anotace": "Proč trávíme třetinu života spánkem a co se v nás při něm děje? Projekt zkoumá spánek jako základní zdroj odolnosti — od biologie snů přes spánkovou hygienu až po vlastní experiment se spánkovým deníkem. Děti zjistí, kolik spánku samy potřebují a jak spánek ovlivňuje paměť, náladu a výkon.", "aktivity": ["Čtyřtýdenní spánkový deník: měření doby a kvality spánku, zpracování dat do grafů a hledání souvislostí (nálada, soustředění)", "Experiment s večerním režimem: týden bez obrazovek před spaním vs. běžný týden, porovnání výsledků", "Návštěva spánkové laboratoře nebo beseda s odborníkem (somnolog, neurolog)", "Stavba „ideální ložnice“ — návrh prostředí pro dobrý spánek (světlo, teplota, zvuk)", "Sny: snový deník, výtvarné či dramatické zpracování snů, vědecký pohled na snění"], "dif2": "Důraz na režim dne, prožitkové aktivity (sny, odpočinek) a jednoduché zaznamenávání spánku.", "dif3": "Důraz na data a experiment: biorytmy, adolescentní posun spánkové fáze, kofein a obrazovky, argumentace vlastními daty.", "loni": "", "znalosti": ["význam spánku pro zdraví a regeneraci; režim dne", "Přírodopis: živé struktury a jejich funkce — nervová soustava, biorytmy", "Osobnostní a sociální výchova: všímá si svého prožívání, postupy předcházení stresu", "Matematika: statistika — sběr dat, diagramy, průměr (spánkový deník)", "Informatika: získá z dat informace a interpretuje je pro řešení problému"], "didaktika": ["u dospívajících počítat s biologickým posunem spánkové fáze — nekárat, ale pracovat s ním (pozdější náročné aktivity, rozhovor o režimu)."]}, {"id": 2, "nazev": "Jsi to, co jíš", "skupina": "SC4", "vedouci": ["4.1.1.3 Stravuji se"], "vedlejsi": ["8.2.3.1 Postarám se o stravování", "8.2.1.3 Pracuji s jednotkami", "8.2.3.3 Obstarávám si věci a zařizuji služby"], "urovne": "obě", "anotace": "Co naše tělo skutečně potřebuje a jak se vyznat v tom, co jíme? Projekt propojuje výživu jako zdroj odolnosti s praktickou dovedností se o sebe postravit: od čtení etiket a plánování jídelníčku po společné vaření. Součástí je kritický pohled na výživové mýty a marketing potravin.", "aktivity": ["Rozbor etiket a složení potravin: cukry, tuky, éčka, kalorie — detektivní práce v obchodě", "Týdenní jídelníček: naplánovat, spočítat cenu i živiny, nakoupit a uvařit vybraná jídla", "Vaření pro školu: příprava plnohodnotného oběda pro skupinu včetně rozpočtu", "Exkurze: pekárna, farma, potravinová banka nebo výrobna potravin", "Mýty o jídle: ověřování výživových tvrzení z reklam a sociálních sítí"], "dif2": "Praktické těžiště: poznávání potravin, jednoduché vaření, zdravá svačina, odkud se jídlo bere.", "dif3": "Nutriční hodnoty a jednotky (kcal, makroživiny), výživové trendy a jejich kritické posouzení, stravování při zátěži a sportu.", "loni": "Složení potravin", "znalosti": ["zdravá a nezdravá výživa, příprava pokrmů; (Ú3) zásady zdravého stravování a rizika nevyváženého stravování", "Chemie: posoudí kvalitu a složení potravin (živiny, aditiva); vlastnosti tuků, sacharidů a bílkovin", "Výchova ke zdraví a bezpečí: výživa a zdraví, poruchy příjmu potravy", "Matematika: procenta, jednotky, poměr — kalkulace jídelníčku a cen", "Polytechnická výchova a praktické činnosti: příprava pokrmů, péče o domácnost"], "didaktika": ["raději skutečné situace (společné vaření, nákup) než umělá cvičení — reálný kontext nese učení."]}, {"id": 3, "nazev": "Hýbu se, tedy jsem", "skupina": "SC4", "vedouci": ["4.1.1.4 Hýbu se"], "vedlejsi": ["4.1.1.6 Odpočívám", "8.2.1.5 Zpracovávám data", "8.3.4.1 Vybírám si volnočasové aktivity"], "urovne": "obě", "anotace": "Pohyb jako zdroj energie, zdraví i radosti. Děti během čtyř týdnů vyzkoušejí širokou paletu pohybových aktivit (od parkouru po jógu), sledují vlastní kondici a hledají pohyb, který je baví a u kterého vydrží. Projekt zkoumá i rovnováhu mezi zátěží a regenerací.", "aktivity": ["Pohybový vzorkovník: každý týden vyzkoušet jiný typ pohybu (lezení, tanec, bojové umění, běh, jóga)", "Měření vlastní kondice na začátku a na konci projektu, zpracování pokroku do grafu", "Návštěva sportoviště či sportovního klubu, beseda se sportovcem nebo fyzioterapeutem", "Návrh a realizace pohybové hry či překážkové dráhy pro mladší děti", "Regenerace v praxi: strečink, relaxace, práce s tepovou frekvencí"], "dif2": "Radost z pohybu a pestrost — hry, dráhy, objevování, jednoduchá měření.", "dif3": "Tréninkové principy, vztah pohybu a duševního zdraví, vlastní tréninkový miniplán a jeho vyhodnocení.", "loni": "", "znalosti": ["pohybové aktivity a sporty; (Ú3) pohyb vhodný pro mne, význam pohybu pro zdraví, základy ergonomie", "Tělesná výchova: zapojuje se do organizace svého pohybového režimu; postupy ke zlepšení tělesné zdatnosti", "Přírodopis: pohybová a oběhová soustava, svaly", "Matematika: měření a porovnání výkonů, grafy pokroku"], "didaktika": ["klíčový je zážitek „zvládl jsem to“ — zpětnou vazbu směřovat na úsilí a strategii, ne na výkon a talent."]}, {"id": 4, "nazev": "V zajetí obrazovek", "skupina": "SC4", "vedouci": ["4.1.1.5 Odolávám závislostem"], "vedlejsi": ["8.2.4.2 Omezuji nebezpečí a rizika digitálních technologií", "5.2.1.5 Rozlišuji mezi lidským a syntetickým vztahem", "4.1.1.6 Odpočívám"], "urovne": "obě", "anotace": "Proč je tak těžké odložit telefon? Projekt zkoumá mechanismy závislostí — od návykových látek po sociální sítě a hry — a to, jak s nimi bojovat. Děti analyzují vlastní digitální návyky, vyzkoušejí digitální detox a nahlédnou do triků, kterými aplikace bojují o naši pozornost.", "aktivity": ["Týdenní měření času na obrazovkách a jeho rozbor: co mi technologie dávají a berou", "Experiment digitální detox: den (víkend) bez telefonu a reflexe prožitku", "Rozbor návykového designu aplikací: nekonečný scroll, notifikace, odměny — a obrana proti nim", "Beseda s adiktologem nebo návštěva preventivního programu", "Kampaň pro školu: plakáty či videa o zdravých digitálních návycích"], "dif2": "Herní a obrazovkové návyky, pravidla doma i ve škole, alternativy k obrazovkám.", "dif3": "Neurobiologie závislosti (dopamin), látkové závislosti a rizikové chování, AI společníci a syntetické vztahy, strategie seberegulace.", "loni": "", "znalosti": ["závislosti na drogách a technologiích — mechanismy vzniku, projevy, prevence, kde hledat pomoc; varovné signály závislostí (sítě, hry)", "podmínky vytváření žádoucích návyků, prokrastinace", "Výchova ke zdraví a bezpečí: rizika návykových látek a činností; nebezpečné aktivity v digitálním prostředí", "Informatika: digitální technologie — digitální stopa, zabezpečení", "Osobnostní a sociální výchova: seberegulace, strategie zvládání impulzů"], "didaktika": ["u dospívajících stavět na autonomii — pravidla pro obrazovky spolutvořit, ne diktovat."]}, {"id": 5, "nazev": "Nevypusť duši", "skupina": "SC4", "vedouci": ["4.1.1.1 Dbám o duševní pohodu"], "vedlejsi": ["4.1.1.6 Odpočívám", "4.2.2.4 Sdílím a říkám si o pomoc", "8.3.1.3 Vyvažuji povinnosti a volný čas", "4.2.3.2 Zotavím se"], "urovne": "obě", "anotace": "Co dělá naši mysl spokojenou a co jí škodí? Projekt o duševní pohodě a péči o ni: optimismus, vděčnost, odpočinek, ale i rozpoznání chvíle, kdy je toho moc a je čas říct si o pomoc. Cílem je odtabuizovat téma duševního zdraví a dát dětem konkrétní nástroje.", "aktivity": ["Mapa mé pohody: co mi dodává a co mi bere energii, osobní „nabíječky a vybíječky“", "Deník vděčnosti a dobrých momentů po dobu projektu, závěrečná reflexe efektu", "Beseda s psychologem či lektory (např. program Nevypusť duši), krizové kontakty a kde hledat pomoc", "Relaxační techniky v praxi: dech, mindfulness, pobyt v přírodě, práce s tichem", "Tvorba „lékárničky duševní pohody“ pro třídu — sdílená sbírka strategií"], "dif2": "Emoce a pohoda skrze prožitek: co mě těší, jak odpočívám, komu se svěřím.", "dif3": "Duševní hygiena v období dospívání, stres ze školy a sítí, mýty o duševních nemocech, systém pomoci (linky, terapie).", "loni": "Nevypusť duši", "znalosti": ["relaxační a meditační techniky; nejčastější duševní onemocnění — prevence a zdroje pomoci; pyramida lidských potřeb", "Osobnostní a sociální výchova: všímá si svého prožívání, uplatňuje postupy předcházení stresu a vyhledání pomoci", "Výchova ke zdraví a bezpečí: denní režim, duševní hygiena, podpora zdraví", "Přírodopis: nervová a hormonální soustava"], "didaktika": ["regulační techniky nacvičovat v klidu, ne až v krizi; emoční korekce má smysl zhruba od 10 let.", "postup od koregulace (s průvodcem) k seberegulaci; nejdřív bezpečí, pak výzvy."]}, {"id": 6, "nazev": "Stres pod lupou", "skupina": "SC4", "vedouci": ["4.2.2.1 Poznám stres", "4.2.2.2 Zvládám stres"], "vedlejsi": ["1.2.2.1 Využívám poznatky o procesu učení", "4.2.2.3 Řeším zátěžové situace", "5.3.2.1 Komunikuji s respektem"], "urovne": "obě", "anotace": "Stres je pradávná výbava těla — kdy nám pomáhá a kdy škodí? Projekt zkoumá fyziologii stresové reakce, učí rozpoznávat vlastní stresové signály a spouštěče a trénuje techniky zvládání: dech, přerámování, humor i jednání pod tlakem. Teorie se střídá s bezpečnými zátěžovými situacemi na zkoušku.", "aktivity": ["Fyziologie stresu: co dělá adrenalin a kortizol s tělem, jednoduché pokusy (tep, reakční doba pod tlakem)", "Mapování vlastních stresorů a projevů stresu, osobní „stresový profil“", "Trénink technik: dechová cvičení, uzemnění, přerámování situace — a jejich testování v zátěži (vystoupení, časovaný úkol)", "Zátěžová hra či úniková situace v týmu s následnou reflexí: co se s námi dělo a co pomohlo", "Rozhovory s lidmi z profesí pod tlakem (záchranář, hasič, moderátor) o tom, jak stres zvládají"], "dif2": "Rozpoznávání emocí a tělesných signálů, jednoduché uklidňovací techniky, zvládnutelné výzvy.", "dif3": "Neurobiologie stresu, prospěšný vs. chronický stres, tréma před zkouškami a vystoupením, deeskalace napětí ve skupině.", "loni": "", "znalosti": ["techniky zmírňování stresu, přerámování, „emoční radar“; (Ú3) stresory a copingové strategie, kognitivní zkreslení vedoucí ke stresu (katastrofizace, černobílé myšlení)", "Osobnostní a sociální výchova: strategie zvládání zátěže, předcházení a řešení náročných situací", "Přírodopis: hormonální soustava — stresová reakce těla", "Matematika/Informatika: měření tepu a reakční doby, vyhodnocení dat"], "didaktika": ["srozumitelný model „tří pater mozku“ pro vysvětlení stresové reakce dětem.", "střední zátěž častěji v malých dávkách; zkoušky a vystoupení trénovat nanečisto v bezpečných variantách."]}, {"id": 7, "nazev": "Expedice: za hranice pohodlí", "skupina": "SC4", "vedouci": ["4.2.1.3 Cíleně posiluji svou odolnost"], "vedlejsi": ["4.2.2.3 Řeším zátěžové situace", "8.2.3.4 Dopravuji se", "5.1.1.4 Funguji ve skupinách", "8.1.1.2 Plánuji a jednám", "1.2.4.4 Přetavuji prožitky ve zkušenosti"], "urovne": "obě", "anotace": "Vyvrcholením projektu je skutečná vícedenní výprava, kterou si děti samy naplánují a zorganizují: trasa, doprava, rozpočet, jídlo, nocleh. Cesta je prostředkem k opuštění komfortní zóny — děti zažijí nepohodlí, únavu i týmové krize a naučí se je zvládat a reflektovat.", "aktivity": ["Plánování expedice: volba cíle, trasy, rozpočtu, vybavení a rozdělení rolí v týmu", "Tréninkové výpravy: orientace v terénu, vaření venku, stavba přístřešku, chůze s batohem", "Samotná expedice (2–4 dny) s přenocováním, ideálně s prvky nepohodlí (počasí, nesení zásob)", "Denní reflexní kruhy na cestě: co bylo těžké, co nás posílilo, jak fungoval tým", "Závěrečné zpracování: expediční deník, mapa, fotoreportáž pro rodiče"], "dif2": "Kratší výprava s větší podporou průvodců, důraz na zážitek, spolupráci a základní tábornické dovednosti.", "dif3": "Děti plánují a vedou expedici samy (průvodce jen jistí), náročnější trasa, plná odpovědnost za rozpočet a logistiku.", "loni": "Expedice", "znalosti": ["rozšiřování komfortní zóny; postupy zvládání krizových situací, principy přežití v přírodě, plán B", "Geografie: kriticky využívá mapy a geografická data, geoinformační technologie; orientace v terénu", "Tělesná výchova: turistika a pobyt v přírodě", "Výchova ke zdraví a bezpečí: osobní bezpečí, první pomoc; bezpečný pohyb v dopravě", "Matematika: rozpočet výpravy, odhady vzdáleností a času"], "didaktika": ["práce venku v nepohodlí s pojmenováním vlastní hranice (zóny komfort–rozvoj–ohrožení); Kolbův cyklus — reflexe a opakované vyzkoušení jsou povinná část, ne bonus."]}, {"id": 8, "nazev": "Umění neúspěchu", "skupina": "SC4", "vedouci": ["4.2.3.3 Přijímám neúspěch a nepřízeň osudu", "4.2.3.4 Proměním zkušenost v růst"], "vedlejsi": ["4.2.1.1 Jsem připraven/a na výzvy", "1.2.4.2 Reflektuji průběh cíleného učení", "8.1.1.3 Reflektuji dosahování cílů"], "urovne": "obě", "anotace": "Selhání je nejlepší učitel — pokud se z něj umíme poučit. Projekt zkoumá slavné neúspěchy vědy, sportu i byznysu, práci s chybou a frustrací a růstové nastavení mysli. Děti si projdou aktivitami, kde je neúspěch nevyhnutelný, a naučí se ho zpracovat, ocenit snahu a zkusit to jinak.", "aktivity": ["Galerie slavných neúspěchů: příběhy vynálezců, sportovců a firem, kterým selhání otevřelo cestu (penicilin, post-it, Dyson)", "„FuckUp night“ po scioškolácku: hosté (rodiče, průvodci) vyprávějí o svých nezdarech a co jim daly", "Záměrně obtížné výzvy (žonglování, rébusy, stavby), kde se chyba čeká — trénink reakce na frustraci", "Deník pokusů a omylů: dokumentace vlastního učení metodou pokus–omyl u zvolené dovednosti", "Divadelní či výtvarné zpracování tématu selhání a vytrvalosti"], "dif2": "Chyba jako kamarád: hry a činnosti s bezpečným neúspěchem, oceňování snahy, jednoduchá reflexe.", "dif3": "Růstové vs. fixní nastavení mysli, strach ze selhání u zkoušek a v soutěžích, analýza vlastních strategií po neúspěchu.", "loni": "", "znalosti": ["příběhy lidí, kteří zvládli náročné situace; model zón; (Ú3) growth vs. fixed mindset, neuroplasticita, techniky práce s chybou (kauzální analýza, „5 proč“)", "Dějepis: posoudí informační hodnotu zdrojů — příběhy objevů a omylů vědy", "Český jazyk a literatura: vypravování, úvaha; tvořivá práce s příběhem", "Osobnostní a sociální výchova: učení z úspěchů i neúspěchů, plán osobního rozvoje"], "didaktika": ["zpětná vazba na úsilí a strategii („co jsi zkusil jinak?“), nikdy na osobu; sbírat zážitky „zvládl jsem to“."]}, {"id": 9, "nazev": "Doktor v nás", "skupina": "SC4", "vedouci": ["4.1.1.8 Léčím se"], "vedlejsi": ["4.1.1.7 Dodržuji pravidla tělesné hygieny", "8.2.6.4 Poskytuji první pomoc", "8.2.7.1 Jednám v právních vztazích"], "urovne": "obě", "anotace": "Co se děje v těle, když jsme nemocní, a jak se uzdravit? Projekt o nemocech, imunitě, prevenci a orientaci ve zdravotnictví: kdy stačí čaj a postel, kdy jít k lékaři a jak vůbec funguje ordinace, pohotovost či pojišťovna. Přirozeně propojuje biologii člověka s praktickým životem.", "aktivity": ["Cesta nemoci tělem: viry, bakterie, imunita — pokusy a modely (šíření „nákazy“ ve třídě jako simulace)", "Domácí lékárnička: co v ní má být, k čemu léky slouží a jaká mají rizika", "Simulace návštěvy lékaře: objednání, popis příznaků, porozumění diagnóze; orientace v systému (praktik, specialista, pohotovost, pojišťovna)", "Exkurze do nemocnice, lékárny či záchranné stanice, beseda se zdravotníkem", "Historie medicíny: od bylinek k antibiotikům a vakcínám, největší objevy"], "dif2": "Základy: hygiena, prevence, běžné dětské nemoci, beze strachu k lékaři.", "dif3": "Imunitní systém do hloubky, antibiotická rezistence, duševní vs. tělesné nemoci, samostatná navigace zdravotnictvím (registrace, e-recept).", "loni": "Co jsou to nemoci?", "znalosti": ["nejčastější duševní onemocnění — prevence a zdroje pomoci", "Přírodopis: biologie člověka — orgánové soustavy, viry a bakterie, nemoci a prevence", "Chemie: léčiva a návykové látky; bezpečná práce s látkami", "Výchova ke zdraví a bezpečí: ochrana a podpora zdraví, prevence přenosných chorob", "Dějepis: dějiny medicíny — od morových ran k vakcínám"], "didaktika": []}, {"id": 10, "nazev": "Měsíc výzev", "skupina": "SC4", "vedouci": ["4.2.1.1 Jsem připraven/a na výzvy", "4.2.1.3 Cíleně posiluji svou odolnost"], "vedlejsi": ["8.1.1.1 Stanovuji si cíle", "1.2.3.3 Pracuji s cíli jako s motorem učení", "4.2.3.1 Ocením se a vydechnu si", "1.2.4.1 Využívám nástroje a metody reflexe učení", "8.1.2.3 Posiluji a udržuji svou motivaci k cílům"], "urovne": "obě", "anotace": "Každý si zvolí osobní výzvu na hranici svých možností — otužování, běh, vystoupení před publikem, týden bez cukru — a čtyři týdny na ní pracuje. Vedle individuálních výzev tým zvládá i výzvy společné. Projekt učí vytrvalosti, práci se strachem a radosti z překonání sebe sama.", "aktivity": ["Volba a nastavení osobní výzvy: zvládnutelná, měřitelná, na hraně komfortní zóny; veřejný závazek", "Společné výzvy: otužování, ranní rozcvičky, výstup na horu, 24 hodin offline", "Průběžné sledování pokroku (tracker, deník) a týdenní sdílecí kruhy", "Práce se strachem a výmluvami: co mi brání a jak to obejít", "Závěrečná oslava: prezentace zvládnutých výzev, ocenění pokroku (ne jen výsledku)"], "dif2": "Kratší a hravější výzvy, silná podpora skupiny, důraz na prožitek úspěchu.", "dif3": "Ambicióznější dlouhodobé výzvy, plán tréninku, analýza selhání a restart, souvislost s cíli do budoucna.", "loni": "Otužování", "znalosti": ["model zón (komfortní–růstová–paniková), metody posilování odolnosti, vnitřní zdroje pro zvládání zátěže; techniky zvládání trémy (vnitřní dialog, vizualizace, dýchání)", "Osobnostní a sociální výchova: stanovuje si plán osobního rozvoje, realizuje kroky a vyhodnotí dosažení cílů", "Tělesná výchova: plánování pohybového režimu, zásady otužování a bezpečnosti", "Matematika: sledování pokroku v datech"], "didaktika": ["formát „Challenge yourself“ ověřený ve ScioŠkolách — série středních výzev (otužování, sauna, lanové centrum, rozhovor s cizím člověkem) + osobní výzvy; zóny znázornit soustřednými kruhy na zemi.", "výzvy volit v zóně rozvoje, nikdy ohrožení; zvláštní citlivost u dětí s PAS/ADHD a senzitivních dětí."]}, {"id": 11, "nazev": "Mozek: návod k použití", "skupina": "SC1", "vedouci": ["1.2.2.1 Využívám poznatky o procesu učení", "1.2.2.3 Volím si učební strategie"], "vedlejsi": ["4.1.1.2 Spím", "1.2.2.4 Učím se soustředěně", "8.1.2.1 Odstraňuji překážky v motivaci", "1.2.2.2 Zařídím si podmínky pro učení", "1.2.2.5 Dávám si věci do souvislostí"], "urovne": "obě", "anotace": "Jak funguje paměť, pozornost a učení — a jak toho využít ve svůj prospěch? Děti si na sobě otestují učební strategie (rozložené opakování, aktivní vybavování, paměťové techniky), prozkoumají, co jejich mozek rozptyluje, a sestaví si vlastní „návod k použití“ své hlavy.", "aktivity": ["Paměťové experimenty: křivka zapomínání, kapacita krátkodobé paměti, testy pozornosti (gorila ve videu)", "Souboj učebních strategií: dvě skupiny se učí totéž různými metodami a porovnají výsledky", "Trénink paměťových technik: paměťový palác, akronymy, příběhová metoda — memorování na výkon", "Pokusy se soustředěním: vliv hluku, multitaskingu a mobilního telefonu na výkon", "Tvorba osobního „návodu k použití mého mozku“ — kdy, kde a jak se mi nejlépe učí"], "dif2": "Hravé experimenty s pamětí a pozorností, jednoduché techniky zapamatování, objevování jak se učím.", "dif3": "Neurony a synapse, kognitivní procesy, metakognice, efektivní příprava na zkoušky a prezentace.", "loni": "", "znalosti": ["proces učení — fungování paměti, role emocí; paměťové techniky (mnemotechniky, asociace, vizualizace); učební strategie (elaborace, sumarizace, vysvětlování druhým)", "fungování pozornosti, podmínky pro soustředění, střídání zátěže a odpočinku", "základní centra mozku (amygdala, hipokampus); (Ú3) neuroplasticita, neurotransmitery", "Osobnostní a sociální výchova: reflektuje své vzdělávací potřeby, využívá efektivní strategie učen ktika": []}, {"id": 23, "nazev": "Parta, tlak a odvaha vybočit", "skupina": "SC5", "vedouci": ["5.1.1.3 Přizpůsobím se nebo odolám sociálnímu tlaku", "5.1.1.4 Funguji ve skupinách"], "vedlejsi": ["5.1.1.2 Někam patřím a přijímám ostatní", "5.2.1.2 Odolám manipulaci a toxicitě ve vztazích", "4.2.2.4 Sdílím a říkám si o pomoc"], "urovne": "obě", "anotace": "Proč děláme věci, které bychom sami neudělali? Projekt o síle skupiny: konformita, stádní chování, efekt přihlížejícího, skupinové role — a odvaha se ozvat. Skrze experimenty, hry a skutečné příběhy děti zkoumají, jak skupiny fungují, jak vzniká vyčleňování a co s tím může udělat jednotlivec.", "aktivity": ["Rekonstrukce slavných experimentů (Asch — konformita, efekt přihlížejícího) v bezpečné školní verzi", "Skupinové role v akci: týmové úkoly s pozorovateli, rozbor kdo jakou roli zaujal", "Příběhy odvahy vybočit: whistlebloweři, zachránci, ten kdo se zastal — beseda či dokument", "Mapování školního kolektivu: kdy je nám spolu dobře, kdo zůstává stranou, drobné inkluzivní činy", "Kampaň proti vyčleňování a šikaně navržená dětmi"], "dif2": "Kamarádství a férovost v partě, rozpoznání ubližování, jak přizvat toho, kdo stojí stranou.", "dif3": "Sociálně-psychologické experimenty a jejich etika, manipulace v partě i online, šikana a kyberšikana, civilní odvaha.", "loni": "", "znalosti": ["manipulativní chování osobně i online a techniky, jak mu čelit", "Výchova ke zdraví a bezpečí: šikana a kyberšikana, vztahy ve skupině, kde hledat pomoc", "Dějepis: dav a propaganda — extremismus, diktatury, role přihlížejících (holokaust)", "Výchova k občanství: vytváří návrh společensky prospěšné akce a zapojuje se (kampaň proti vyčleňování)", "Přírodopis: sociální chování živočichů (etologie)"], "didaktika": []}, {"id": 24, "nazev": "Přátelství pod mikroskopem", "skupina": "SC5", "vedouci": ["5.2.2.1 Vybírám si přátele", "5.2.2.2 Buduji kvalitní přátelství"], "vedlejsi": ["5.1.1.1 Vnímám a přijímám druhé", "5.2.1.1 Buduji vztahy založené na důvěře", "5.2.1.4 Napravuji narušené vztahy"], "urovne": "obě", "anotace": "Co dělá z kamaráda přítele a proč některá přátelství vydrží celý život? Projekt zkoumá vznik, údržbu i opravy přátelství: důvěru, vzájemnost, loajalitu, ale i hádky a usmíření. Kombinuje psychologii vztahů s uměleckým a literárním zpracováním a s praktickými výzvami v reálných vztazích dětí.", "aktivity": ["Mapa mých vztahů: okruhy blízkosti, co od koho čerpám a co dávám", "Velká přátelství v literatuře a filmu: co je drželo pohromadě, rozbor krizí a usmíření", "Dílna omluvy a odpuštění: jak vypadá plnohodnotná omluva, scénky nápravy vztahu", "Přátelská výzva: konkrétní investice do skutečného vztahu (dopis, společný zážitek, podpora)", "Mezigenerační rozhovory: co o přátelství vědí prarodiče a lidé s celoživotními přáteli"], "dif2": "Co je kamarádství, sdílení a půjčování, řešení drobných sporů, přijímání odlišností.", "dif3": "Hloubka vs. počet vztahů, důvěra a zrada, přátelství online, proměny přátelství v dospívání.", "loni": "", "znalosti": ["Osobnostní a sociální výchova: sociální a etický rozvoj — vztahy, důvěra, spolupráce", "Výchova ke zdraví a bezpečí: vztahy mezi lidmi a formy soužití", "Český jazyk a literatura: charakteristika; přátelství v literatuře a filmu; tvořivá práce s textem", "Anglický jazyk: témata pocity, přátelé, rodina"], "didaktika": []}, {"id": 25, "nazev": "Moje kořeny", "skupina": "SC5", "vedouci": ["5.2.3.1 Mám své místo v rodině"], "vedlejsi": ["5.2.3.2 Přispívám k fungování domácnosti", "5.1.1.5 Nakládám s hranicemi a autoritou", "1.1.2.2 Učím se s pomocí jiných", "5.2.3.4 I v rodině ctím hranice"], "urovne": "obě", "anotace": "Odkud jsem a kdo jsou moji lidé? Děti pátrají po historii vlastní rodiny — rodokmen, rodinné příběhy, fotografie, recepty a tradice — a zároveň zkoumají, jak rodina funguje dnes: role, pravidla, hranice i vlastní podíl na chodu domácnosti. Projekt citlivě pracuje s rozmanitostí rodinných uspořádání.", "aktivity": ["Tvorba rod , "Informatika: 3D modelování, automatizace", "Výtvarná a filmová výchova: design výrobku"], "didaktika": []}, {"id": 39, "nazev": "Zelená farma", "skupina": "SC8", "vedouci": ["8.2.5.3 Pěstuji nebo chovám"], "vedlejsi": ["1.1.2.7 Získávám poznatky vědeckými metodami", "4.1.1.3 Stravuji se", "8.2.3.1 Postarám se o stravování"], "urovne": "obě", "anotace": "Projekt s hlínou za nehty: děti založí či rozvinou školní záhon, pěstují plodiny od semínka po sklizeň a pečují o zvířata (školní slepice, žížalí kompostér, akvárium). Zkoumají, co rostliny a zvířata potřebují, odkud se bere jídlo a co obnáší každodenní odpovědnost za živé tvory.", "aktivity": ["Založení či rozšíření školního záhonu/vyvýšených záhonů: plán osazení, setí, péče, sklizeň", "Péče o zvířata: služby u školních slepic či jiných zvířat, krmení, čištění, pozorování chování", "Pěstitelské experimenty: vliv světla, vody a hnojení — férové testy s měřením", "Exkurze na farmu, do zahradnictví či záchranné stanice; beseda s farmářem", "Sklizňová slavnost: vaření z vypěstovaného, výrobky (bylinková sůl, sirup), kompost a koloběh živin"], "dif2": "Těžiště úrovně 2: každodenní péče, pozorování, radost ze sklizně, vztah ke zvířatům.", "dif3": "Plánování produkce, ekonomika malé farmy, půda a udržitelnost, šlechtění a osiva, automatizace zálivky.", "loni": "Slepice a odpadky; Hlídáme planetu", "znalosti": ["Přírodopis: organismy a prostředí; zapojí se do péče o přírodu ve svém okolí (přímý OVU revize!); fotosyntéza, potravní řetězce", "Polytechnická výchova a praktické činnosti: péče o zahradu, pěstitelství a chovatelství", "Chemie: voda, půda, hnojiva, pH", "Geografie: udržitelnost života na Zemi, zodpovědné jednání v prostoru", "Matematika: evidence měření růstu, grafy"], "didaktika": []}, {"id": 40, "nazev": "Právo pro život", "skupina": "SC8", "vedouci": ["8.2.7.1 Jednám v právních vztazích"], "vedlejsi": ["8.2.2.2 Platím daně", "8.3.3.2 Pracuji v zaměstnání", "5.1.1.8 Nakládám s autoritou"], "urovne": "3", "anotace": "Smlouvy, reklamace, občanka, brigáda, pokuta — právo potkáváme denně, aniž o něm víme. Projekt pro třetí trojročí učí rozpoznat právní rozměr běžných situací, rozumět smlouvám, znát svá práva i povinnosti a vědět, kdy je čas zavolat právníkovi. Vyvrcholením je simulovaný soud.", "aktivity": ["Právo všedního dne: co je smlouva (i ústní!), nákup, reklamace, půjčení věci — rozbor reálných situací", "Čtení skutečné smlouvy: najít v nájemní či pracovní smlouvě podstatné náležitosti a záludnosti", "Návštěva skutečného soudního jednání a beseda se soudcem, advokátem či policistou", "Simulovaný soudní proces: role žalobce, obhájce, svědků a poroty na vymyšleném případu", "Odpovědnost mladistvých: co mi hrozí v 13, 15, 18 letech; brigády, podpisy, trestní odpovědnost"], "dif2": "—", "dif3": "Určeno primárně 3. trojročí; práce s reálnými dokumenty, důraz na situace blízké věku (brigády, nákupy online, odpovědnost za škodu, digitální podpisy).", "loni": "", "znalosti": ["Výchova k občanství: pracuje s ukázkami konkrétních právních textů (Ústava ČR, Listina, zákony, smlouvy — přímý OVU revize!); demokratická vs. autokratická vláda", "Český jazyk a literatura: porozumění úřednímu a právnímu textu; žádost, formální dopis", "Dějepis: vývoj práva a ústavnosti", "Osobnostní a sociální výchova: kariérový rozvoj — brigády, pracovní vztahy", "Matematika: daně a procenta"], "didaktika": []}];
const SCN = {SC4:"SC4 Rozvíjím svou odolnost", SC1:"SC1 Umím se učit", SC5:"SC5 Buduji dobré vztahy", SC8:"SC8 Mám život ve svých rukou"};
const COL = {SC4:["var(--sc4)","var(--sc4bg)"], SC1:["var(--sc1)","var(--sc1bg)"], SC5:["var(--sc5)","var(--sc5bg)"], SC8:["var(--sc8)","var(--sc8bg)"]};
const TRT = {"obě":"2. i 3. trojročí","2":"jen 2. trojročí","3":"jen 3. trojročí"};
let fSC="vse", fTR="vse", q="";

const grid=document.getElementById("grid"), count=document.getElementById("count");
const overlay=document.getElementById("overlay"), detail=document.getElementById("detail");

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function hay(t){return norm([t.nazev,t.anotace,t.vedouci.join(" "),t.vedlejsi.join(" "),t.aktivity.join(" "),(t.znalosti||[]).join(" ")].join(" "));}

function render(){
  const nq=norm(q);
  const items=DATA.filter(t=>
    (fSC==="vse"||t.skupina===fSC) &&
    (fTR==="vse"||t.urovne==="obě"||t.urovne===fTR) &&
    (!nq||hay(t).includes(nq)));
  grid.innerHTML=items.map(t=>{
    const [c,cb]=COL[t.skupina];
    return `<div class="card" style="--accent:${c};--accentbg:${cb}" onclick="openD(${t.id})">
      <div class="num">Téma ${t.id}</div>
      <h3>${t.nazev}</h3>
      <div class="tagrow"><span class="tag">${SCN[t.skupina]}</span><span class="tag tr">${TRT[t.urovne]}</span></div>
      <p>${t.anotace}</p>
      <div class="kam">Kameny: ${t.vedouci.map(k=>k.split(" ")[0]).join(", ")}${t.vedlejsi.length?" + "+t.vedlejsi.map(k=>k.split(" ")[0]).join(", "):""}</div>
    </div>`;}).join("");
  count.textContent=`Zobrazeno ${items.length} z ${DATA.length} témat`;
}

function openD(id){
  const t=DATA.find(x=>x.id===id); if(!t) return;
  const [c,cb]=COL[t.skupina];
  detail.style.setProperty("--accent",c);
  const sec=(title,body,open=false)=>`<details${open?" open":""}><summary>${title}</summary>${body}</details>`;
  let h=`<button class="closebtn" onclick="closeD()">✕</button>
    <div class="num">Téma ${t.id} · ${SCN[t.skupina]} · ${TRT[t.urovne]}</div>
    <h2>${t.nazev}</h2>
    <div class="anot">${t.anotace}</div>`;
  h+=sec("Stěžejní kameny",`<ul>${t.vedouci.map(k=>`<li class="lead">${k}</li>`).join("")}</ul>`,true);
  h+=sec("Vedlejší kameny",`<ul>${t.vedlejsi.map(k=>`<li>${k}</li>`).join("")}</ul>`);
  h+=sec("Náměty aktivit",`<ul>${t.aktivity.map(a=>`<li>${a}</li>`).join("")}</ul>`);
  if(t.znalosti&&t.znalosti.length) h+=sec("Tvrdé znalosti — příklady učiva",`<ul>${t.znalosti.map(z=>`<li>${z}</li>`).join("")}</ul>`);
  if(t.didaktika&&t.didaktika.length) h+=sec("Z didaktiky ScioCíle",`<ul>${t.didaktika.map(d=>`<li>${d}</li>`).join("")}</ul>`);
  let dif=`<div class="difbox">`;
  if(t.dif2!=="—") dif+=`<b>2. trojročí:</b> ${t.dif2}<br>`;
  dif+=`<b>3. trojročí:</b> ${t.dif3}</div>`;
  h+=sec("Diferenciace podle trojročí",dif);
  if(t.loni) h+=sec("Návaznost na projekty 2025/26",`<div class="loni">${t.loni}</div>`);
  detail.innerHTML=h;
  overlay.classList.add("open");
  document.body.style.overflow="hidden";
  detail.scrollTop=0;
}
function closeD(){overlay.classList.remove("open"); document.body.style.overflow="";}
overlay.addEventListener("click",e=>{if(e.target===overlay) closeD();});
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeD();});

document.getElementById("scChips").addEventListener("click",e=>{
  if(!e.target.dataset.sc) return;
  fSC=e.target.dataset.sc;
  [...e.currentTarget.children].forEach(ch=>ch.classList.toggle("active",ch===e.target));
  render();});
document.getElementById("trChips").addEventListener("click",e=>{
  if(!e.target.dataset.tr) return;
  fTR=e.target.dataset.tr;
  [...e.currentTarget.children].forEach(ch=>ch.classList.toggle("active",ch===e.target));
  render();});
document.getElementById("search").addEventListener("input",e=>{q=e.target.value; render();});
render();
</script>
